name: 每週永續準則動態更新

on:
  schedule:
    - cron: "0 13 * * 0"   # 每週日 13:00 UTC = 台灣時間週日 21:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r scraper/requirements.txt

      - name: 執行每週更新
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scraper/weekly_update.py

      - name: 提交變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          if git diff --cached --quiet; then
            echo "沒有變更，跳過提交"
          else
            git commit -m "chore: weekly sustainability updates [$(date -u +%Y-%m-%d)]"
            git push
          fi

      # 第二步：較強的模型查證待確認動態，把建議修改開成 PR（合併前不會生效）
      - name: 審查待確認動態並開 PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list --state open --label status-review --json number --jq '.[].number')" ]; then
            echo "已有未處理的審查 PR，這週先跳過"
            exit 0
          fi
          python scraper/weekly_update.py --review --pr-body "$RUNNER_TEMP/pr_body.md"
          if git diff --quiet; then
            echo "沒有建議修改，不開 PR"
            exit 0
          fi
          BRANCH="review/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add data/status.json data/updates.json
          git commit -m "review: 待確認動態查證建議 [$(date -u +%Y-%m-%d)]"
          git push -u origin "$BRANCH"
          gh label create status-review --color FBCA04 --description "待確認動態的查證建議" --force
          gh pr create --base main --head "$BRANCH" \
            --title "待確認動態查證建議 $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/pr_body.md" \
            --label status-review
